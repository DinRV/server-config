# Application Configuration
# Uses custom YAML types for environment interpolation and computed values

server:
  port: !env PORT
  host: '0.0.0.0'
  
database:
  url: !env DATABASE_URL
  pool:
    min: 2
    max: !eval "require('os').cpus().length * 2"
    idleTimeout: 30000
    
redis:
  url: !env REDIS_URL
  
logging:
  level: !env LOG_LEVEL
  format: json
  
session:
  secret: !env SESSION_SECRET
  maxAge: 86400000
